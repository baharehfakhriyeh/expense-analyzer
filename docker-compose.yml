services:
  postgres:
    image: postgres:17-alpine
    container_name: expense-analyzer-postgres
    environment:
      POSTGRES_DB: expense_analyzer
      POSTGRES_USER: expense
      POSTGRES_PASSWORD: expense
    ports:
      - "5432:5432"
    volumes:
      - expense-analyzer-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U expense -d expense_analyzer"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  expense-analyzer-postgres-data:
